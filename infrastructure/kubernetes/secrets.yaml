# Secret template (section 35).
#
# This file is a SHAPE, not a secret store. Do not commit real values: create
# the Secret from a sealed-secret, an external secrets operator, or:
#
#   kubectl create secret generic agent-secrets \
#     --from-literal=LLM_API_KEY=... \
#     --from-literal=GITHUB_TOKEN=... \
#     --from-literal=DATABASE_PASSWORD=...
#
# The agent itself can never read this: the policy engine blocks writes to
# anything matching *secret*/*credential* and the tool layer has no way to read
# a pod's environment.
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_ME"
  GITHUB_TOKEN: "REPLACE_ME"
  GITHUB_REPOSITORY: "your-org/your-repo"
