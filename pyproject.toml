[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-agent"
version = "0.1.0"
description = "AI Software Engineering Agent - local-first POC with a scalable control-plane architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "langgraph>=1.0",
    "anthropic>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools]
packages = [
    "core",
    "persistence", "persistence.models", "persistence.repositories",
    "infrastructure", "infrastructure.queue", "infrastructure.events", "infrastructure.locks",
    "llm", "agents", "graph",
    "tools", "tools.filesystem", "tools.repository", "tools.git", "tools.testing",
    "providers", "providers.scm", "providers.ci",
    "retrieval", "retrieval.ingestion", "retrieval.search",
    "policies",
    "apps", "apps.api", "apps.api.routes", "apps.worker",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: exercises a real dotnet build or test run (minutes, not seconds)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ holds the design document; its code blocks are the spec, not our source.
exclude = [".venv", ".sandbox", "apps/web", "sample-repo", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "FURB", "BLE", "C4"]
ignore = [
    # FastAPI's dependency-injection idiom is `param = Depends(...)` in the
    # signature; B008 flags every route handler in the project.
    "B008",
    # Long lines inside docstrings and ASCII diagrams are deliberate.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on broad behaviour and re-import inside functions on purpose.
"tests/**" = ["BLE001"]
